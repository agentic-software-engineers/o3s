name: Test
on:
  pull_request:
    # leave a change to the documentation alone to the checks that read it
    paths-ignore:
      - '**.md'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

permissions:
  contents: read

# stop a run once a newer push to the same pull request or branch supersedes it
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LIMA_VERSION: 2.3.0

jobs:
  golangci-lint:
    # lint on every host system o3s runs on
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-26, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      # keep LF endings, which the formatters expect
      - name: Set gitconfig
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      # check out the code the linters read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # install the Go toolchain the module names
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # lint and check formatting with the pinned linter version
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      # check out the release config and the installer it publishes
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # check the release config, so a broken one fails here rather than at release
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.2
          args: check

      # check the installer with the shellcheck the runner image ships
      - name: Check the installer
        run: shellcheck install.sh

  go-test:
    runs-on: ubuntu-latest
    steps:
      # check out the code the tests cover
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # install the Go toolchain the module names
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # run the unit tests and scenarios that need nothing beyond Go, with the race detector on
      - name: Run the tests
        run: go test -race -count=1 ./...

  stack:
    # run the suite on every supported release and every architecture the images ship for, once lint and the unit tests pass
    needs: [golangci-lint, go-test]
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-26.04
          - ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      # check out the repo so the suite drives this branch's cage scripts and compose files
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # require the confinement the suite reads back
      - name: Require AppArmor
        run: aa-enabled

      # install the Go toolchain the module names
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # install this commit's build with this branch's install.sh into a fresh home, the devcontainer CLI included, the way a bare machine does
      - name: Install o3s on a bare home
        run: |
          release="$(mktemp -d)"
          home="$(mktemp -d)"
          asset="o3s-linux-$(go env GOARCH)"
          go build -o "${release}/${asset}" ./cmd/o3s
          (cd "${release}" && sha256sum "${asset}" > checksums.txt)
          HOME="${home}" O3S_RELEASE_URL="file://${release}" sh install.sh
          "${home}/.local/share/o3s/devcontainers/bin/devcontainer" --version

      # run the tests that raise one component of the stack, built from this branch
      - name: Run the integration tests
        run: go test -tags integration -count=1 -v ./test/integration/...

      # install the CLI this host's editor raises the stack with, at the version the lockfile pins
      - name: Install the dev container CLI
        run: |
          npm ci --prefix .github/tools --ignore-scripts --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/.github/tools/node_modules/.bin" >> "$GITHUB_PATH"

      # run the tests that raise the whole stack on this host, the way the editor raises it
      - name: Run the e2e tests
        env:
          # let bake read the Dockerfile the CLI writes outside the build context, which the runners' Compose
          # withholds by default
          BUILDX_BAKE_ENTITLEMENTS_FS: 0
        run: go test -tags e2e -count=1 -v ./test/e2e/process/...

      # require the checkout as clean as the suites found it, since every test works in a home of its own
      - name: Check the checkout stays clean
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  unix:
    # install o3s on a bare host the way a user does and boot a home's VM through it, on the runners that offer virtualization,
    # once lint and the unit tests pass
    needs: [golangci-lint, go-test]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 70
    steps:
      # check out the code the suite builds
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # install the Go toolchain the module names
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # hand the runner user the hardware virtualization
      - name: Set up QEMU and KVM
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends ovmf qemu-system-x86 qemu-utils
          sudo modprobe kvm
          sudo chown "${USER}" /dev/kvm

      # restore the VM image from an earlier run, kept per system until the template pins another
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/lima/download
            ~/Library/Caches/lima/download
          key: lima-download-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('internal/vm/o3s.yaml') }}

      # run the suite that boots the home's VM through the o3s CLI
      - name: Run the VM tests
        run: go test -tags e2e -count=1 -timeout 60m -v ./test/e2e/vm/...

  hcs:
    # boot a home's VM on Windows, on the runner whose user is an Administrator, once lint and the unit tests pass
    needs: [golangci-lint, go-test]
    runs-on: windows-2025
    timeout-minutes: 70
    steps:
      # keep LF endings, so the checkout matches the other runners
      - name: Set gitconfig
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      # check out the code the suite builds
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # install the Go toolchain the module names
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # install the pinned VM manager, checked against its published sum
      - name: Install Lima
        env:
          ARCHIVE: lima-2.3.0-Windows-AMD64.zip
          SHA256: fbd49036909ba3833ea8618743bd3a051eb21049c80c0772452f79ed45af99dc
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP $env:ARCHIVE
          Invoke-WebRequest -Uri "https://github.com/lima-vm/lima/releases/download/v$env:LIMA_VERSION/$env:ARCHIVE" -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          # stop on an archive that differs from the published one
          if ($hash -ne $env:SHA256) { throw "checksum mismatch: $hash" }
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'lima')
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:RUNNER_TEMP 'lima\bin')

      # restore the VM image from an earlier run, kept per system until the template pins another
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/lima/download
          key: lima-download-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('internal/vm/o3s.yaml') }}

      # run the suite that boots the home's VM through the o3s CLI
      - name: Run the VM tests
        run: go test -tags e2e -count=1 -timeout 60m -v ./test/e2e/vm/...
