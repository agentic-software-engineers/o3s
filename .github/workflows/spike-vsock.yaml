name: Spike vsock
on:
  workflow_dispatch:
  push:
    branches:
      - spike/vsock

permissions:
  contents: read

jobs:
  linux:
    # boot a cage VM with no network device and prove its one link, vsock, carries its allowed traffic alone
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # check out the scripts and the VM template
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # install QEMU, the allow-list proxy and the seed tool, and hand the runner user KVM and vsock
      - name: Set up QEMU, KVM and vsock
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils tinyproxy cloud-image-utils
          sudo systemctl stop tinyproxy
          sudo modprobe kvm
          sudo modprobe vhost_vsock
          sudo chown "${USER}" /dev/kvm /dev/vhost-vsock

      # run the spike and keep its log for the summary
      - name: Run the vsock spike
        shell: bash
        run: bash spike/vsock.sh 2>&1 | tee spike.log

      # write each check's outcome and duration into the run's summary
      - name: Summarize
        if: always()
        run: |
          {
            echo "### vsock on Linux"
            echo "| check | result | time |"
            echo "|---|---|---|"
            grep '^RESULT' spike.log | sed 's/^RESULT //' || true
          } >> "${GITHUB_STEP_SUMMARY}"

  prepare:
    # convert the pinned image into the disks macOS and Windows boot, and write the Windows seed
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # check out the scripts and the VM template
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # download the pinned image, check its digest, and convert it
      - name: Convert the image
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends qemu-utils cloud-image-utils zstd
          url="$(awk '/location:.*amd64/ {gsub(/"/, "", $3); print $3}' internal/vm/o3s.yaml)"
          sum="$(awk '/amd64/ {f=1} f && /digest:/ {gsub(/"|sha256:/, "", $2); print $2; exit}' internal/vm/o3s.yaml)"
          curl -fsSLo base.img "${url}"
          echo "${sum}  base.img" | sha256sum -c
          mkdir mac win
          qemu-img convert -f qcow2 -O raw base.img disk.raw
          zstd -q -T0 disk.raw -o mac/disk.raw.zst
          qemu-img create -q -f qcow2 -b base.img -F qcow2 big.qcow2 30G
          qemu-img convert -f qcow2 -O vhdx -o subformat=dynamic big.qcow2 win/disk.vhdx
          bash spike/vsock-seed.sh win
          cloud-localds win/seed.iso win/user-data win/meta-data
          ls -la mac win

      # hand macOS its raw disk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-disk
          path: mac
          retention-days: 1
          compression-level: 0

      # hand Windows its disk, seed and key
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win-vm
          path: win
          retention-days: 1

  macos:
    # boot the cage VM under Virtualization.framework with no network device, linked over vsock alone
    needs: prepare
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      # check out the scripts and the proxy
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # take the raw disk the prepare job made
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-disk
          path: ${{ runner.temp }}/vsock

      # install the Go toolchain the proxy names
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: spike/vsockhost/go.mod
          cache: false

      # build the proxy, and vfkit from its pinned tag, signed with its virtualization entitlement
      - name: Build the proxy and vfkit
        run: |
          (cd spike/vsockhost && go build -o "${RUNNER_TEMP}/vsock/vsockhost" .)
          git clone -q --depth 1 --branch v0.6.4 https://github.com/crc-org/vfkit "${RUNNER_TEMP}/vfkit-src"
          make -C "${RUNNER_TEMP}/vfkit-src" out/vfkit-amd64
          cp "${RUNNER_TEMP}/vfkit-src/out/vfkit-amd64" "${RUNNER_TEMP}/vsock/vfkit"

      # run the spike and keep its log for the summary
      - name: Run the vsock spike
        shell: bash
        run: bash spike/vsock-mac.sh 2>&1 | tee spike.log

      # write each check's outcome and duration into the run's summary
      - name: Summarize
        if: always()
        run: |
          {
            echo "### vsock on macOS"
            echo "| check | result | time |"
            echo "|---|---|---|"
            grep '^RESULT' spike.log | sed 's/^RESULT //' || true
          } >> "${GITHUB_STEP_SUMMARY}"

  windows:
    # boot the cage VM under the Host Compute Service with no network adapter, linked over Hyper-V sockets alone
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      # check out the scripts and the host tool
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # take the disk, seed and key the prepare job made
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: win-vm
          path: ${{ runner.temp }}/vsock

      # install the Go toolchain the host tool names
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: spike/vsockhost/go.mod
          cache: false

      # build the host tool that boots the VM and serves the proxy
      - name: Build the host tool
        shell: bash
        run: cd spike/vsockhost && go build -o "$(cygpath -u "${RUNNER_TEMP}")/vsock/vsockhost.exe" .

      # run the spike and keep its log for the summary
      - name: Run the vsock spike
        shell: bash
        run: bash spike/vsock-win.sh 2>&1 | tee spike.log

      # write each check's outcome and duration into the run's summary
      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo "### vsock on Windows"
            echo "| check | result | time |"
            echo "|---|---|---|"
            grep '^RESULT' spike.log | sed 's/^RESULT //' || true
          } >> "${GITHUB_STEP_SUMMARY}"
