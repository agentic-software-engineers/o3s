name: Lint Go
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # lint on every host system o3s runs on, the way Lima's lint-go job does (lima .github/workflows/test.yml:72-78)
  golangci-lint:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-26, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      # keep LF endings, which golangci-lint's formatters need on Windows (golangci/golangci-lint discussions/5840)
      - name: Set gitconfig
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      # check out the code the linters read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # install the Go toolchain the module names
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # lint and check formatting with the pinned linter version
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      # check out the release config and the installer it publishes
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # check the release config, so a broken one fails here rather than at release
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.2
          args: check

      # check the installer with the shellcheck the runner image ships
      - name: Check the installer
        run: shellcheck install.sh
