name: Fuzz
on:
  # press random keys on the menu every week, apart from the checks a change runs
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  menu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # check out the code the fuzzer drives
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # install the Go toolchain the module names
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # press random keys on every home for ten minutes, a failing input printed to add to testdata/fuzz
      - name: Fuzz the menu
        run: go test -run '^$' -fuzz '^FuzzMenu$' -fuzztime 10m ./internal/tui
