# NAME
#        compose.yaml — the o3s stack: the cage.
#
# DESCRIPTION
#        One service with no network of its own. The cage reaches the internet through the
#        host's o3s process alone, over the sockets in the folder it mounts: its tools speak to
#        a proxy port and a DNS port on its loopback, which o3s-cage carries to those sockets,
#        and the host process holds the allowlist and swaps this host's secrets in.
#
# USAGE
#        o3s init writes this file into a home, and the editor raises it when it opens the
#        home's workspace in the container. o3s update rebuilds it.
#
# SEE ALSO
#        apparmor.conf, devcontainer.json, o3s.json

# Stack name
name: o3s

# The proxy the cage's tools reach on its loopback
x-proxy: &proxy http://127.0.0.1:3128

# Apps deployed by stack
services:
  # The dev container the work happens in, reaching the internet through the host's o3s process alone.
  cage:
    image: ghcr.io/hansehart/o3s-cage:latest
    # Each release pins its own tag, so pull the cage image when absent
    pull_policy: missing
    env_file: .env
    # Point every tool at the proxy on the cage's loopback, in both spellings tools read
    environment:
      HTTP_PROXY: *proxy
      HTTPS_PROXY: *proxy
      ALL_PROXY: *proxy
      http_proxy: *proxy
      https_proxy: *proxy
      all_proxy: *proxy
      NO_PROXY: localhost,127.0.0.1,::1
      no_proxy: localhost,127.0.0.1,::1
      # Node reads the proxy variables once asked to
      NODE_USE_ENV_PROXY: "1"
      # Java reads its proxy from system properties
      JAVA_TOOL_OPTIONS: -Dhttp.proxyHost=127.0.0.1 -Dhttp.proxyPort=3128 -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=3128 -Dhttp.nonProxyHosts=localhost|127.0.0.1
      # git over ssh opens its connection as a tunnel through the proxy
      GIT_SSH_COMMAND: ssh -o ProxyCommand="o3s-cage connect %h %p"
    volumes:
      # The home, read-only, with its policy and the stack's scripts
      - ../:/home/ubuntu/o3s:ro
      # Persistent state for installed features
      - features:/home/ubuntu/features
      # Volume mount for project to work with across sessions
      - projects:/home/ubuntu/projects
      # Public proxy CA, folded into the trust store
      - ${O3S_PROXY_DIR}/mitmproxy-ca.crt:/usr/local/share/ca-certificates/mitmproxy-ca.crt:ro
      # The host's sockets for the cage, its one way out
      - ${O3S_SOCKETS}:/run/o3s:ro
    # Limit ressource usage
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: 4
        #reservations:
        #  devices:
        #    - driver: nvidia
        #      count: all
        #      capabilities: [gpu]
    # Capabilities the daemon leaves unused, one of them creating device nodes at will
    cap_drop:
      - MKNOD
      - NET_RAW
      - AUDIT_WRITE
    # The device the userspace network stack builds its tap on
    devices:
      - /dev/net/tun
    # Its own profile and syscall filter, over a procfs left open enough to mount
    security_opt:
      # Let exec grant the file capabilities the daemon's id-mapping helpers hold
      - no-new-privileges=false
      - apparmor=${O3S_APPARMOR_PROFILE:-o3s-cage}
      - seccomp=./seccomp.json
      - systempaths=unconfined
    # Bring the cage up with its bridge to the host's sockets
    command: bash /home/ubuntu/o3s/.devcontainer/cage/start.sh
    # Ready once the bridge answers on the proxy port and on the DNS port, the last it opens
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3128 && exec 4<>/dev/tcp/127.0.0.53/53"]
      interval: 1s
      timeout: 2s
      retries: 60
    # The loopback alone, so every way out leads through the host's sockets
    network_mode: none
    # Resolve through the bridge's DNS port, with the host's search domains left out
    dns:
      - 127.0.0.53
    dns_search:
      - .

volumes:
  features:
  projects:
