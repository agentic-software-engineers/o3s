# NAME
#        compose.dev.yaml — development overlay running a second o3s stack from this checkout
#
# DESCRIPTION
#        Renames the stack and runs the cage image built from this checkout, so the o3s under
#        development runs beside the o3s in daily use.
#
# USAGE
#        The stack tests layer this file over a home's compose.yaml once they loaded the cage
#        image built from the commit under test. By hand, from a home made by o3s init, with
#        that image loaded, docker compose -f .devcontainer/compose.yaml
#        -f <checkout>/test/stacktest/compose.dev.yaml up.
#
# SEE ALSO
#        compose.yaml, devcontainer.json

# Stack name, so volumes land under o3s-dev_* and stay separate
name: o3s-dev

services:
  cage:
    # Run the loaded cage image alone, so a missing load fails instead of pulling a release
    pull_policy: never
    volumes:
      # The home, writable while o3s is under development
      - ../:/home/ubuntu/o3s
